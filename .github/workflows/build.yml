name: Build Pulsar Binaries

on:
  push:
    branches:
      - 'master'
    tags:
      - '**'
  pull_request:
  workflow_dispatch:

env:
  # Variables needed for build information
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  PYTHON_VERSION: '3.12'
  # Version of the conda-forge compiler toolchain we use for Linux compilation,
  # and of the `micromamba` we install it with. See the long comment in the
  # "Install Modern GCC Toolchain" step below.
  GCC_VERSION: '12'
  MICROMAMBA_VERSION: '2.9.0-0'
  # The oldest `glibc`/`libstdc++` we promise to run against, enforced by the
  # "Verify Linux ABI Floor" step. These correspond to our current `glibc`
  # support pledge on the website. (We may be able to go lower than this; it's
  # worth investigating.)
  MAX_GLIBC_VERSION: '2.31'
  MAX_GLIBCXX_VERSION: '3.4.28'
  ROLLING_UPLOAD_TOKEN: ${{ secrets.ROLLING_RELEASE_UPLOAD_TOKEN }}
  # Below variables allow us to quickly control visual tests for each platform
  RUN_WINDOWS_VT: false
  RUN_LINUX_VT: true
  RUN_MACOS_VT: true

jobs:
  build:
    strategy:
      matrix:
        os: [ macos-14, ubuntu-24.04-arm, ubuntu-latest, windows-2022 ]
        node-architecture: [ '' ]
        include:
          - os: macos-14
            node-architecture: x64
          - os: ubuntu-24.04-arm
            image: "debian:10"
          - os: ubuntu-latest
            image: "debian:10"
      fail-fast: false
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.image }}
    outputs:
      timestamp: ${{ steps.linux-binary-version.outputs.timestamp }}

    steps:
      # Debian 10 is long since EOL, so its packages live on
      # `archive.debian.org` and we repoint `apt` accordingly.
      #
      # We had tried building on Debian 11, but it was in the process of being
      # archived — a process that takes a while and makes that OS hard to
      # depend on for builds.
      #
      # We can still build on such an old OS as long as we use conda-forge's
      # vendored toolchain.
    - name: Edit sources.list - Linux
      if: ${{ runner.os == 'Linux' }}
      run: |
        sed -i s/deb.debian.org/archive.debian.org/g /etc/apt/sources.list
        sed -i s/security.debian.org/archive.debian.org/g /etc/apt/sources.list
        # Unlike master's version of this step, we run `apt-get update` here:
        # the GCC toolchain step below needs `curl` before "Install build
        # dependencies" (which does its own update) has run.
        apt-get update

      # We want to build against the oldest version of `glibc` that we can get
      # away with. (As of Electron 32, the version we target is `glibc` 2.31,
      # though it's possible we could go lower than that.)
      #
      # But at some point in the recent past, V8 started enforcing use of a
      # compiler that understands C++20, and this started affecting Pulsar once
      # it bumped past a certain version of Electron.
      #
      # Debian 10 gives us a `glibc` below the ceiling we want, but its builtin
      # `gcc` doesn't fit the bill. (It runs `gcc` version 8.3.0, much too old
      # for C++20 support.)
      #
      # Electron's V8 version tends to be driven by Chromium; so even though
      # Electron 32.2.3 uses Node 20.18.1, it combines it with a much higher
      # version of V8 than the standalone Node 20.18.1 used.
      #
      # For this reason, even a dependency like `@pulsar-edit/fuzzy-native`,
      # which builds perfectly well on Node 20.18.1 with C++17, fails at the
      # rebuild step because of V8's more stringent requirements.
      #
      # The way out of this is to decouple the target `glibc` from that of the
      # host machine — allowing us to use newer `gcc` on Debian 10 without
      # raising the `glibc` floor above 2.31. To do this, we install
      # conda-forge's vendored static toolchain.
      #
      # The difference in V8 version used between Node and Electron (even for
      # an equivalent release of Node) can result in different compilation
      # outcomes. For instance, there is a combination of `glibc` and `gcc`
      # that allows `fuzzy-native` to build just fine initially but fail when
      # being rebuilt for Electron.
      #
      # Currently, under Debian 10, we need to use conda-forge in order for our
      # native modules to compile. If we bump the Debian version in the future,
      # this may change; it'll be a race between the OS we build on and the
      # version of Node we implicitly use (which will increase over time as we
      # catch up with Electron releases).
      #
      # But we can decide whether we need conda-forge on a step-by-step basis;
      # it's as simple as pointing the relevant environment variables to
      # `PULSAR_CC`, `PULSAR_CXX`, etc., for whichever other steps require
      # them.
      #
      # We should do further research on whether we can get away with a lower
      # version of `glibc`. It does us no good to aim to support `glibc` lower
      # than what Electron themselves commit to, but circumstantial evidence
      # suggests that Electron can still support `glibc` lower than 2.31.
    - name: Restore Modern GCC Toolchain from Cache - Linux
      id: cache-gcc-toolchain
      if: ${{ runner.os == 'Linux' }}
      uses: actions/cache@v5
      with:
        path: /opt/gcc-toolchain
        # Solving and downloading the toolchain takes a couple of minutes on
        # every leg of the matrix, and the result is a pure function of the
        # inputs named in this key… so we can cache it wholesale. Bump any of
        # the versions below and you get a fresh toolchain automatically.
        key: gcc-toolchain-${{ runner.arch }}-conda-forge-gcc${{ env.GCC_VERSION }}-micromamba${{ env.MICROMAMBA_VERSION }}

    - name: Install Modern GCC Toolchain - Linux
      if: ${{ runner.os == 'Linux' && steps.cache-gcc-toolchain.outputs.cache-hit != 'true' }}
      run: |
        # No `apt-get update` needed; we ran it in a previous step.
        apt-get install -y curl ca-certificates
        if [ "${{ runner.arch }}" = "ARM64" ]; then
          MAMBA_ARCH=linux-aarch64
          MAMBA_SHA256=9f93b974adcb4d166996af969b6cd371287d1a3e52733704727884d9b74cb7a7
        else
          MAMBA_ARCH=linux-64
          MAMBA_SHA256=366cd9cd8be14df1ab8ed50352a82111082a36686b2d389fdb79a92c3fafb3e3
        fi
        # Pinned by version _and_ by hash: this binary is the root of trust for
        # the entire compiler toolchain, so we don't want `latest` silently
        # changing what we build with. To bump it, grab the new version's
        # published `micromamba-<arch>.sha256` files and paste them above.
        curl -Lo /usr/local/bin/micromamba --fail --show-error --silent \
          "https://github.com/mamba-org/micromamba-releases/releases/download/${{ env.MICROMAMBA_VERSION }}/micromamba-${MAMBA_ARCH}"
        echo "${MAMBA_SHA256}  /usr/local/bin/micromamba" | sha256sum --check --strict
        chmod +x /usr/local/bin/micromamba
        export MAMBA_ROOT_PREFIX=/opt/micromamba
        /usr/local/bin/micromamba create -y -p /opt/gcc-toolchain -c conda-forge \
          "gcc=${{ env.GCC_VERSION }}" "gxx=${{ env.GCC_VERSION }}"

    - name: Configure Modern GCC Toolchain - Linux
      if: ${{ runner.os == 'Linux' }}
      run: |
        if [ "${{ runner.arch }}" = "ARM64" ]; then
          CONDA_TARGET=aarch64-conda-linux-gnu
          MULTIARCH=aarch64-linux-gnu
        else
          CONDA_TARGET=x86_64-conda-linux-gnu
          MULTIARCH=x86_64-linux-gnu
        fi
        echo "PULSAR_CC=/opt/gcc-toolchain/bin/${CONDA_TARGET}-gcc" >> "$GITHUB_ENV"
        echo "PULSAR_CXX=/opt/gcc-toolchain/bin/${CONDA_TARGET}-g++" >> "$GITHUB_ENV"
        # The `-I` flags point the vendored compiler at the _system_ headers,
        # so that we compile against Debian 10's `glibc` instead of the newer
        # one that ships inside the conda environment.
        echo "PULSAR_CFLAGS=-I/usr/include -I/usr/include/${MULTIARCH}" >> "$GITHUB_ENV"
        echo "PULSAR_CXXFLAGS=-I/usr/include -I/usr/include/${MULTIARCH}" >> "$GITHUB_ENV"
        # `-static-libstdc++ -static-libgcc` is the other half of that bargain,
        # and it's the part that's easy to forget. GCC 12 will happily emit
        # code that references symbols from its own, much newer `libstdc++`
        # (`GLIBCXX_3.4.29` and up); Debian 10 ships `GLIBCXX_3.4.25`. Since we
        # don't ship the conda environment to users, dynamically linking
        # against it would produce binaries that build and test green here but
        # fail to load on precisely the older distros this whole dance exists
        # to support. Linking those two runtimes statically keeps the ABI
        # surface of our native modules limited to `glibc` itself.
        #
        # The "Verify Linux ABI Floor" step below exists to make sure this
        # actually worked, rather than trusting that it did.
        echo "PULSAR_LDFLAGS=-static-libstdc++ -static-libgcc -L/usr/lib/${MULTIARCH} -L/usr/lib" >> "$GITHUB_ENV"

    - name: Install build dependencies - Linux
      if: ${{ runner.os == 'Linux' }}
      run: apt-get update && apt-get install -y git python3 python3-pip make gcc g++ file libx11-dev libxkbfile-dev pkg-config libsecret-1-dev rpm xvfb ffmpeg zstd wget squashfs-tools libwayland-dev libwayland-client0 libxkbcommon-dev libxkbcommon-x11-dev libxkbcommon0 xkb-data
       libncursesw5-dev libssl-dev libsqlite3-dev tk-dev libgdbm-dev libc6-dev libbz2-dev libffi-dev zlib1g-dev # <-- Python-related stuff on this line

    - name: Restore Compiled Python from Cache - Linux
      if: ${{ runner.os == 'Linux' }}
      id: compiled-python-restore
      uses: actions/cache/restore@v5
      with:
        key: ${{ runner.os }}-${{ runner.arch }}-${{ matrix.image }}-Python-${{ env.PYTHON_VERSION }}.9
        path: Python-${{ env.PYTHON_VERSION }}.9

    - name: Compile Python - Linux
      if: ${{ runner.os == 'Linux' && steps.compiled-python-restore.outputs.cache-hit != 'true' }}
      run: |
        wget "https://www.python.org/ftp/python/${PYTHON_VERSION}.9/Python-${PYTHON_VERSION}.9.tgz"
        echo "45313e4c5f0e8acdec9580161d565cf5fea578e3eabf25df7cc6355bf4afa1ee  Python-${PYTHON_VERSION}.9.tgz" | sha256sum --check
        tar xzf "Python-${PYTHON_VERSION}.9.tgz"
        cd "Python-${PYTHON_VERSION}.9"
        ./configure --enable-optimizations
        make

    - name: Save Compiled Python to Cache - Linux
      if: ${{ runner.os == 'Linux' && steps.compiled-python-restore.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@v5
      with:
        key: ${{ runner.os }}-${{ runner.arch }}-${{ matrix.image }}-Python-${{ env.PYTHON_VERSION }}.9
        path: Python-${{ env.PYTHON_VERSION }}.9

    - name: Install Compiled Python - Linux
      if: ${{ runner.os == 'Linux' }}
      run: cd "Python-${PYTHON_VERSION}.9" && make install

    - name: Checkout the latest code
      uses: actions/checkout@v6

    - name: Setup Node
      uses: actions/setup-node@v6
      with:
        node-version-file: '.nvmrc'
        architecture: ${{ matrix.node-architecture }}

    - name: Setup Python
      # actions/setup-python's copy of Python is compiled for too-new `glibc`,
      # which won't work in a Debian 10 Docker image.
      # Get Python from apt repos instead on Linux.
      if: ${{ runner.os != 'Linux' }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install Python setuptools
      # This is needed for Python 3.12+, since many versions of node-gyp
      # are incompatible with Python 3.12+, which no-longer ships `distutils`
      # out of the box. `setuptools` package provides `distutils`.
      run: python3 -m pip install setuptools

    - name: Install Yarn - Linux
      if: ${{ runner.os == 'Linux' }}
      run: npm install -g yarn

    - name: Setup Git Submodule
      if: ${{ runner.os != 'Linux' }}
      run: |
        git submodule init
        git submodule update

    - name: Setup Git Submodule - Linux
      if: ${{ runner.os == 'Linux' }}
      run: |
        git config --global --add safe.directory /__w/pulsar/pulsar
        git submodule init
        git submodule update

    - name: Set Timestamp for Binary Version - Linux
      id: linux-binary-version
      if: ${{ runner.os == 'Linux' }}
      # This output is currently only set for the sake of the Rolling binary
      # upload script. See the "test-and-upload-Linux" job below.
      run: echo "timestamp=`date -u +%Y%m%d%H`" >> "$GITHUB_OUTPUT"

    - name: Check Pulsar Version
      if: ${{ runner.os != 'Windows' }}
      run: sed -i -e "s/[0-9]*-dev/`date -u +%Y%m%d%H`/g" package.json

    - name: Check Pulsar Version - Windows
      if: ${{ runner.os == 'Windows' }}
      run: (Get-Content package.json) -replace '[0-9]*-dev', (date -u +%Y%m%d%H) | Set-Content -Path package.json

    - name: Explicitly Specify Python Path (Windows)
      if: ${{ runner.os == 'Windows' }}
      # The Windows image somehow gets confused about which Python it should
      # use. Here we set the `PYTHON` env variable to whatever we get when we
      # run `python3` in a shell, since that's the copy we used to install
      # `setuptools` above.
      run: |
        Get-Command python3 | Format-Wide -Property Source
        $pythonPath = (Get-Command python3)[0].Source
        echo "PYTHON=$pythonPath" >> $env:GITHUB_ENV

    - name: Install Windows 10 SDK via Visual Studio
      if: ${{ runner.os == 'Windows' }}
      working-directory: 'C:\Program Files (x86)\Microsoft Visual Studio\Installer'
      run: |
        .\vs_installer.exe modify --installPath "C:\Program Files\Microsoft Visual Studio\2022\Enterprise" --add Microsoft.VisualStudio.Component.Windows10SDK.19041 --quiet --norestart --nocache | Out-Host
      # Slight funk here, the command will act async if we don't wait for its
      # result. `--wait` isn't supported on `vs_installer.exe` So we use the
      # pipe to ensure we wait for output, but for the LIFE (#1350) I can't get
      # output here.

    - name: Install Pulsar Dependencies (non-Linux)
      if: ${{ runner.os != 'Linux' }}
      uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60
      with:
        timeout_minutes: 30
        max_attempts: 3
        retry_on: error
        command: yarn install --ignore-engines
        on_retry_command: rm -R node_modules

      # Debian 10's system `g++` is GCC 8.3, which predates the `-std=c++20`
      # spelling — it only understands the provisional `-std=c++2a`. And
      # `fuzzy-native`'s `binding.gyp` asks for `-std=c++20` outright, so the
      # very first `node-gyp rebuild` fails during plain `yarn install`, long
      # before `electron-rebuild` gets a chance to use the vendored toolchain.
      # So we point this step at that toolchain too.
      #
      # This step is split by platform rather than given a shared `env:` block
      # because `PULSAR_CC` and friends are only set on Linux; elsewhere they
      # would expand to the empty string and hand `node-gyp` a blank compiler
      # override on platforms that currently build fine.
    - name: Install Pulsar Dependencies (Linux)
      if: ${{ runner.os == 'Linux' }}
      uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60
      env:
        CC: ${{ env.PULSAR_CC }}
        CXX: ${{ env.PULSAR_CXX }}
        CFLAGS: ${{ env.PULSAR_CFLAGS }}
        CXXFLAGS: ${{ env.PULSAR_CXXFLAGS }}
        LDFLAGS: ${{ env.PULSAR_LDFLAGS }}
      with:
        timeout_minutes: 30
        max_attempts: 3
        retry_on: error
        command: yarn install --ignore-engines
        on_retry_command: rm -R node_modules

    - name: Rebuild Pulsar Dependencies for Electron (non-Linux)
      if: ${{ runner.os != 'Linux' }}
      uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60
      with:
        timeout_minutes: 30
        max_attempts: 3
        retry_on: error
        command: yarn build

    - name: Rebuild Pulsar Dependencies for Electron (Linux)
      if: ${{ runner.os == 'Linux' }}
      uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60
      env:
        CC: ${{ env.PULSAR_CC }}
        CXX: ${{ env.PULSAR_CXX }}
        CFLAGS: ${{ env.PULSAR_CFLAGS }}
        CXXFLAGS: ${{ env.PULSAR_CXXFLAGS }}
        LDFLAGS: ${{ env.PULSAR_LDFLAGS }}
      with:
        timeout_minutes: 30
        max_attempts: 3
        retry_on: error
        command: |
          yarn build

      # The whole reason we build in an old Debian image is to keep our `glibc`
      # requirement low. Nothing about the build fails loudly if we
      # accidentally raise it, though! We don't test it in old Debian; we do
      # smoke tests on `ubuntu-latest`. Hence if we do it wrong, the failure
      # shows up on a user's machine. So we check explicitly with a script that
      # verifies we meet the desired `glibc` version floor.
    - name: Verify Linux ABI Floor
      if: ${{ runner.os == 'Linux' }}
      run: script/check-linux-abi-floor.sh node_modules

    - name: Build ppm
      uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60
      env:
        # `ppm`'s postinstall downloads a bundled Node into a temp directory
        # and then `fs.rename`s it into `ppm/bin`. A rename can't cross
        # devices, and in a container job the runner bind-mounts several
        # separate volumes: the image's own `/tmp`, the workspace at `/__w`,
        # and — despite the nesting in the path — `/__w/_temp` as well. So
        # neither `/tmp` nor `runner.temp` works here; both fail with `EXDEV`.
        # Pointing at the workspace root is what actually guarantees the same
        # device as `ppm/bin`.
        #
        # The workspace root, rather than a subdirectory of it, so that no
        # `mkdir` is needed: this step also runs on Windows, whose shell would
        # reject `mkdir -p`. `download-node.js` calls `temp.track()`, so the
        # `apm-node-*` directories it leaves in the repo root are cleaned up
        # when the process exits.
        #
        # This is a workaround for the environment, not a fix: `mv()` in
        # `ppm/script/download-node.js` has no `EXDEV` fallback since the `mv`
        # package was dropped upstream, and its own comment says it was copied
        # verbatim from `ppm`'s `fs.js` — so the same bug is probably lurking
        # there too. Remove this once `ppm` is fixed.
        #
        # No platform guard needed: Node only consults `TMPDIR` on POSIX, so
        # this is inert on Windows (which uses `TEMP`/`TMP`).
        TMPDIR: ${{ github.workspace }}
      with:
        timeout_minutes: 30
        max_attempts: 3
        retry_on: error
        command: yarn build:apm

    - name: Cache Pulsar dependencies - Linux
      if: ${{ runner.os == 'Linux' }}
      uses: actions/cache/save@v5
      with:
        path: |
          node_modules
          packages
        key: Linux-dependencies-${{ runner.arch }}-${{ github.sha }}-${{ github.workflow }}

    # macOS Signing Stuff
    - name: Build Pulsar Binaries (macOS) (Signed)
      if: ${{ runner.os == 'macOS' && github.event_name == 'push' }}
      # Note: PRs generated from forks cannot access GitHub Secrets.
      # So if the PR is from a fork, we can still build, but cannot sign.
      # Note: We aren't attempting to sign for *any* PRs anymore, though.
      env:
        CSC_LINK: ${{ secrets.CSC_LINK }}
        CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        APPLEID: ${{ secrets.APPLEID }}
        APPLEID_PASSWORD: ${{ secrets.APPLEID_PASSWORD }}
        TEAM_ID: ${{ secrets.TEAM_ID }}
      uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60
      with:
        timeout_minutes: 31
        max_attempts: 7
        command: yarn dist

    - name: Build Pulsar Binaries (macOS) (Unsigned)
      if: ${{ runner.os == 'macOS' && github.event_name != 'push' }}
      uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60
      with:
        timeout_minutes: 31
        max_attempts: 7
        command: yarn dist

    - name: Build Pulsar Binaries
      if: ${{ runner.os != 'macOS' }}
      uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60
      with:
        timeout_minutes: 30
        max_attempts: 3
        retry_on: error
        command: yarn dist

    - name: Rename Pulsar Binaries for Regular release (ARM64 Linux)
      if: ${{ runner.os == 'Linux' && runner.arch == 'ARM64' }}
      run: node ./script/rename.js "ARM.Linux"

    - name: Rename Pulsar Binaries for Regular release (x64 Linux)
      if: ${{ runner.os == 'Linux' && runner.arch == 'X64' }}
      run: node ./script/rename.js "Linux"

    - name: Rename Pulsar Binaries for Regular release (ARM64 macOS)
      if: ${{ runner.os == 'macOS' && runner.arch == 'ARM64' && matrix.node-architecture != 'x64' }}
      run: node ./script/rename.js "Silicon.Mac"

    - name: Rename Pulsar Binaries for Regular release (x64 macOS)
      if: ${{ runner.os == 'macOS' && ( runner.arch == 'X64' || matrix.node-architecture == 'x64' ) }}
      run: node ./script/rename.js "Intel.Mac"

    - name: Rename Pulsar Binaries for Regular release (Windows)
      if: ${{ runner.os == 'Windows' }}
      run: node ./script/rename.js "Windows"

    - name: Fix AppImage target - x64 Linux
      if: ${{ runner.os == 'Linux' && runner.arch == 'X64' }}
      run: ./script/fix-linux-appimage.sh x86_64

    - name: Fix AppImage target - ARM64 Linux
      if: ${{ runner.os == 'Linux' && runner.arch == 'ARM64' }}
      run: ./script/fix-linux-appimage.sh ARM_64

    # The Linux binaries used to be saved to the Actions cache here as well, so
    # that the `test-and-upload-Linux` job below could pick them up. They were
    # by far our largest cache entries (~800MB per architecture per commit),
    # and between them they routinely pushed the repo past GitHub's 10GB cache
    # allowance — at which point GitHub evicts least-recently-used entries and
    # the test job would find nothing waiting for it.
    #
    # The upload below already persists exactly the same files, and artifacts
    # don't count against the cache allowance, so the test job downloads them
    # from here instead. Artifacts also outlive the run, which means re-running
    # just the test job hours later works, where the cached copy would long
    # since have been evicted.
    - name: Upload Binary Artifacts
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.os }} ${{ matrix.node-architecture }} Binaries
        path: ./binaries/*

    - name: Test Binary - Windows
      if: runner.os == 'Windows' && env.RUN_WINDOWS_VT == true
      # TODO: Convert script to PowerShell.
      run: |
        mkdir extracted; tar -xf binaries/*zip -C ./extracted/
        export BINARY_NAME=./extracted/Pulsar.exe
        PLAYWRIGHT_JUNIT_OUTPUT_NAME=report.xml npx playwright test --reporter=junit,list || echo "Yeah, tests failed, Windows is like this"

    - name: Test Binary - macOS
      if: runner.os == 'macOS' && env.RUN_MACOS_VT == true
      run: |
        export PATH="/usr/local/opt/node@16/bin:/usr/local/bin:$PATH"
        rm -R node_modules/electron; yarn install --check-files
        hdiutil mount binaries/*Pulsar*dmg
        export BINARY_NAME=`ls /Volumes/Pulsar*/Pulsar.app/Contents/MacOS/Pulsar`
        PLAYWRIGHT_JUNIT_OUTPUT_NAME=report.xml arch -x86_64 npx playwright test --reporter=junit,list

    - name: Add binaries to Rolling Release Repo
      if: ${{ github.event_name == 'push' && runner.os != 'Linux' }}
      # We only want to upload rolling binaries if they are a commit to master
      # Otherwise we want to not upload if it's a PR or manually triggered build
      run: |
        cd ./script/rolling-release-scripts
        npm install
        node ./rolling-release-binary-upload.js

    - name: Upload Video Artifacts
      # Run whether this job passed or failed, unless explicitly cancelled.
      if: ${{ !cancelled() && runner.os != 'Linux' }}
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.os }} Videos
        path: ./tests/videos/**


  test-and-upload-Linux:
    # I couldn't figure out how to get these visual tests to actually run in the
    # Debian Docker environment. If anyone can make it work, feel free to
    # re-combine visual testing on Linux back into the main build job above!
    # - DeeDeeG
    strategy:
      matrix:
        os: [ ubuntu-24.04-arm, ubuntu-latest ]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    needs: build

    steps:
    - name: Install build dependencies - Linux
      if: ${{ runner.os == 'Linux' }}
      run: sudo apt-get update && sudo apt-get install -y git python3 python3-pip make gcc g++ file libx11-dev libxkbfile-dev pkg-config libsecret-1-dev rpm xvfb ffmpeg zstd wget squashfs-tools libwayland-dev libwayland-client0 libxkbcommon-dev libxkbcommon-x11-dev libxkbcommon0 xkb-data

    - name: Checkout the latest code
      uses: actions/checkout@v6

    - name: Setup Node
      uses: actions/setup-node@v6
      with:
        # We have plans to align on a node version org-wide, but this might be
        # the place to skip it. When we bump Electron and need to test with a
        # new Node, we should use a self-contained source of truth like the
        # `.nvmrc` file. Then, once we land such a version bump, the org-wide
        # variable can be updated.
        node-version-file: '.nvmrc'

    # Download the artifact rather than restoring from cache. We only get so
    # much cache space!
    #
    # `pattern` rather than `name` because the uploading step interpolates an
    # empty `matrix.node-architecture` into the name, leaving a double space
    # that's easy to get wrong by hand. Only one artifact per run matches each
    # of these patterns.
    - name: Download Pulsar Binaries - Linux
      if: ${{ runner.os == 'Linux' }}
      uses: actions/download-artifact@v7
      with:
        pattern: ${{ matrix.os }}*Binaries
        merge-multiple: true
        path: ./binaries

    # `download-artifact` only errors on a missing artifact when it's given an
    # exact `name`. With a `pattern` it filters to an empty list and exits
    # happily. Check explicitly so that a missing binary is reported here
    # rather than as an inscrutable glob failure in the middle of the test step
    # below.
    - name: Verify binaries were downloaded - Linux
      if: ${{ runner.os == 'Linux' }}
      run: |
        if ! ls ./binaries/*AppImage > /dev/null 2>&1; then
          echo "::error::No AppImage in ./binaries — the '${{ matrix.os }}*Binaries' artifact from the build job is missing or empty."
          exit 1
        fi
        # Artifacts are zipped for transport, and zip doesn't carry the Unix
        # permission bits: everything comes back as 644, so the AppImage we
        # just downloaded is not executable. (The cache we used to use for
        # this handoff was a tarball, which _did_ preserve the executable bit…
        # hence this step having no ancestor in the cache-based version.)
        chmod +x ./binaries/*AppImage
        ls -la ./binaries

    - name: Restore Cached Pulsar dependencies - Linux
      if: ${{ runner.os == 'Linux' }}
      uses: actions/cache/restore@v5
      with:
        path: |
          node_modules
          packages
        key: Linux-dependencies-${{ runner.arch }}-${{ github.sha }}-${{ github.workflow }}

    - name: Test Binary - Linux
      if: ${{ (runner.os == 'Linux') && env.RUN_LINUX_VT }}
      # We deliberately throw away the Electron that was rebuilt for the app
      # and let `yarn` reinstall a stock one, since Playwright drives the
      # packaged binary and needs an `electron` that runs under plain Node.
      #
      # `-rf`, not `-R`: the dependency cache above is allowed to miss, and on
      # a miss there's no `node_modules` at all. Easy recovery: just do another
      # `yarn install`.
      run: |
        rm -rf node_modules/electron
        yarn install --check-files
        ./binaries/*AppImage --appimage-extract
        export BINARY_NAME='squashfs-root/pulsar'
        mkdir -p ./tests/videos
        Xvfb -screen 0 1024x768x24+32 :99 & nohup ffmpeg -video_size 1024x768 -f x11grab -i :99.0 ./tests/videos/out.mpg & DISPLAY=:99 PLAYWRIGHT_JUNIT_OUTPUT_NAME=report.xml npx playwright test --reporter=junit,list

    - name: Check Pulsar Version
      if: ${{ runner.os != 'Windows' }}
      run: sed -i -e "s/[0-9]*-dev/${TIMESTAMP}/g" package.json
      env:
        TIMESTAMP: ${{needs.build.outputs.timestamp}}

    - name: Add binaries to Rolling Release Repo - Linux
      if: ${{ github.event_name == 'push' && runner.os == 'Linux' }}
      # We only want to upload rolling binaries if they are a commit to master.
      # Otherwise we want to skip upload if it's a PR or manually-triggered
      # build.
      run: |
        cd ./script/rolling-release-scripts
        npm install
        node ./rolling-release-binary-upload.js

    - name: Upload Video Artifacts - Linux
      # Run whether this job passed or failed, unless explicitly cancelled.
      if: ${{ !cancelled() && runner.os == 'Linux' }}
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.os }} Videos
        path: ./tests/videos/**
