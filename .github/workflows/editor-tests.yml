name: Editor tests
on:
  pull_request:
  push:
    branches: ['master']
env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  ATOM_JASMINE_REPORTER: list

jobs:
  tests:
    name: Tests
    if: |
      !startsWith(github.event.pull_request.title, '[skip-ci]') &&
      !startsWith(github.event.pull_request.title, '[skip-editor-ci]')
    strategy:
      matrix:
        # os: [ubuntu-20.04, macos-13, windows-2019]
        os: [ubuntu-latest, macos-14, windows-2022]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
    - name: Install build dependencies
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y libx11-dev libxkbfile-dev pkg-config libsecret-1-dev libncursesw5-dev libgdbm-dev libc6-dev libffi-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libxkbcommon0 xkb-data

    - name: Checkout the latest code
      uses: actions/checkout@v6
      with:
        submodules: true

    - name: Setup node
      uses: actions/setup-node@v6
      with:
        node-version-file: '.nvmrc'

    - name: Install Python setuptools
      # This is needed for Python 3.12+, since many versions of node-gyp
      # are incompatible with Python 3.12+, which no-longer ships 'distutils'
      # out of the box. 'setuptools' package provides 'distutils'.
      run: python3 -m pip install setuptools --break-system-packages

    - name: Install Dependencies
      run: yarn install --ignore-engines || yarn install --ignore-engines

    - name: Build Dependencies
      run: yarn build

    # TEMPORARY (troubleshooting): ask Windows Error Reporting to write a local
    # dump for any process that dies of an unhandled exception. This is
    # independent of Electron's own crash reporter, which has so far produced
    # nothing for the `0xC0000005` renderer crashes. Remove once those are
    # understood.
    - name: Enable Windows crash dumps
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $dir = "$env:GITHUB_WORKSPACE\wer-dumps"
        New-Item -ItemType Directory -Force -Path $dir | Out-Null
        $key = 'HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps'
        New-Item -Path $key -Force | Out-Null
        New-ItemProperty -Path $key -Name DumpFolder -Value $dir -PropertyType ExpandString -Force | Out-Null
        New-ItemProperty -Path $key -Name DumpCount  -Value 10  -PropertyType DWord -Force | Out-Null
        New-ItemProperty -Path $key -Name DumpType   -Value 2   -PropertyType DWord -Force | Out-Null
        Get-ItemProperty -Path $key

    - name: Run Tests
      if: runner.os != 'Linux'
      run: yarn start --test spec

    - name: Run Tests with xvfb-run (Linux)
      if: runner.os == 'Linux'
      run: xvfb-run --auto-servernum yarn start --test spec

    # The renderer can die without producing any JS-level output, so we should
    # grab a crashdump whenever that happens.
    - name: Collect crash dumps
      if: failure()
      shell: bash
      run: |
        mkdir -p crash-dumps
        DUMPS="${ATOM_HOME:-$HOME/.pulsar}/crashdumps"
        echo "HOME=$HOME ATOM_HOME=${ATOM_HOME:-<unset>}"
        echo "Looking for crash dumps in $DUMPS"
        if [ -d "$DUMPS" ]; then
          echo "Source directory exists; contents:"
          ls -laR "$DUMPS" || true
          cp -R "$DUMPS/." crash-dumps/ || true
        else
          echo "Source directory does NOT exist; listing its parent:"
          ls -la "$(dirname "$DUMPS")" || echo "parent does not exist either"
        fi
        # TEMPORARY (troubleshooting): also collect Windows Error Reporting
        # dumps. Relative path on purpose — $GITHUB_WORKSPACE is a Windows path
        # and this step runs in that directory anyway.
        if [ -d wer-dumps ]; then
          echo "WER dumps found:"
          ls -laR wer-dumps || true
          mkdir -p crash-dumps/wer
          cp -R wer-dumps/. crash-dumps/wer/ || true
        else
          echo "No WER dumps at ./wer-dumps"
        fi
        echo "Staged for upload:"
        ls -laR crash-dumps || true

    - name: Upload crash dumps
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: Crash dumps (${{ matrix.os }})
        path: ./crash-dumps/*
        if-no-files-found: ignore
        retention-days: 7
