# Temporary: checks whether `integration/open-file.spec.js` can detect
# pulsar-edit/pulsar#1685 in CI, by running it against released AppImages:
# 1.133.0 (has the crash) and 1.132.1 (control; doesn't). Remove this file once
# we have an answer.
name: Regression 1685 Smoke Test

on:
  pull_request:

jobs:
  smoke:
    strategy:
      matrix:
        version: [ '1.133.0', '1.132.1' ]
      fail-fast: false
    runs-on: ubuntu-latest

    steps:
    - name: Checkout the latest code
      uses: actions/checkout@v6

    - name: Setup Node
      uses: actions/setup-node@v6
      with:
        node-version-file: '.nvmrc'

    - name: Install Xvfb
      run: sudo apt-get update && sudo apt-get install -y xvfb

    - name: Download and extract Pulsar ${{ matrix.version }}
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release download "v${{ matrix.version }}" -R pulsar-edit/pulsar \
          -p "Linux.Pulsar-${{ matrix.version }}.AppImage" -D binaries
        chmod +x binaries/*.AppImage
        ./binaries/*.AppImage --appimage-extract > /dev/null
        ls squashfs-root/pulsar

      # Just Playwright, in its own directory, rather than all of Pulsar's
      # dependencies. `helpers.js` resolves `playwright` from its parent
      # directory, so the specs go alongside a minimal `package.json`.
    - name: Install Playwright
      env:
        PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      run: |
        mkdir smoke
        cp -R integration playwright.config.ts smoke/
        cd smoke
        echo '{ "private": true }' > package.json
        npm install --no-audit --no-fund playwright@1.22.2 @playwright/test@1.22.2

      # `CI` is cleared so that `helpers.js` doesn't record video (which needs
      # Playwright's `ffmpeg` download) and the config doesn't retry: a crash
      # should fail once, loudly.
    - name: Run open-file spec against ${{ matrix.version }}
      working-directory: smoke
      env:
        CI: ''
        BINARY_NAME: ${{ github.workspace }}/squashfs-root/pulsar
      run: xvfb-run -a npx playwright test integration/open-file.spec.js --reporter=list

      # Pulsar writes crash dumps to `$ATOM_HOME/crashdumps`
      # (`src/main-process/start.js`), and `integration/helpers.js` sets
      # `ATOM_HOME` to `tmp/<profile>` relative to where the tests run.
    - name: Upload crash dumps, if any
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.version }} crash dumps
        path: smoke/tmp/*/crashdumps/**
        if-no-files-found: ignore
